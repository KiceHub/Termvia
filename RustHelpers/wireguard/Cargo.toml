[package]
name = "termvia-wireguard"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.13", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4-fragmentation", "proto-ipv6", "socket-tcp", "socket-tcp-cubic"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
zeroize = "1"
